name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module files
        run: go mod verify

      - name: Scan reachable dependency vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check shell scripts and third-party notices
        run: |
          bash -n install.sh run.sh scripts/*.sh scripts/lab/*.sh
          bash scripts/generate-third-party-notices.sh /tmp/THIRD_PARTY_NOTICES.1.txt
          bash scripts/generate-third-party-notices.sh /tmp/THIRD_PARTY_NOTICES.2.txt
          cmp /tmp/THIRD_PARTY_NOTICES.1.txt /tmp/THIRD_PARTY_NOTICES.2.txt
          grep -q '^Module: modernc.org/sqlite$' /tmp/THIRD_PARTY_NOTICES.1.txt

      - name: Install Cosign for installer integration
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify pinned release run and install flows
        run: |
          cosign_path="$(command -v cosign)"
          if [[ "$cosign_path" != /usr/local/bin/cosign ]]; then
            sudo install -m 0755 "$cosign_path" /usr/local/bin/cosign
          fi
          VPS_SCOPE_VERSION=v1.0.0 VPS_SCOPE_REQUIRE_SIGNATURE=1 bash run.sh version
          sudo env VPS_SCOPE_REQUIRE_SIGNATURE=1 bash install.sh \
            --version v1.0.0 --install-dir /tmp/vps-scope-install-test
          /tmp/vps-scope-install-test/vps-scope version

      - name: Check PowerShell laboratory runner
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/lab/run-connectivity-matrix.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }

      - name: Vet
        run: go vet ./...

      - name: Static analysis
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint .github/workflows/*.yml
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
          gosec -quiet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Fuzz parser trust boundaries
        run: |
          go test ./internal/audit -run=^$ -fuzz=FuzzProxyConfigParsersDoNotPanic -fuzztime=5s
          go test ./internal/audit -run=^$ -fuzz=FuzzEvidenceTextParsersDoNotPanic -fuzztime=5s
          go test ./internal/report -run=^$ -fuzz=FuzzSafeBundleFileName -fuzztime=5s

      - name: Enforce coverage ratchet
        run: bash scripts/check-coverage.sh

      - name: Cross-build Linux targets
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/vps-scope-amd64 ./cmd/vps-scope
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/vps-scope-arm64 ./cmd/vps-scope
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/vps-scope-lab-helper ./scripts/lab/net-helper.go
          /tmp/vps-scope-amd64 version

      - name: Run a complete Linux audit and verify its report
        run: |
          /tmp/vps-scope-amd64 audit --lang en --profile general --format bundle --output /tmp/vps-scope-smoke --quiet
          /tmp/vps-scope-amd64 verify /tmp/vps-scope-smoke
          jq -e '
            (.findings | length) == 55 and
            .metadata.collector_contract_repairs == "0" and
            .metadata.collector_command_budget_rejections == "0" and
            .metadata.collector_file_budget_rejections == "0" and
            .metadata.collector_topology_budget_rejections == "0" and
            .metadata.collection_timed_out == "false" and
            .metadata.native_self_test == "disabled-by-default"
          ' /tmp/vps-scope-smoke/report.json
